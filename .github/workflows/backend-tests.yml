name: Backend Tests

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  test:
    runs-on: windows-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
        
    - name: Install dependencies
      working-directory: ./backend
      run: npm ci
      
    - name: Lint code
      working-directory: ./backend
      run: npm run lint
      
    - name: Run tests
      working-directory: ./backend
      run: npm run test
      
    - name: Run tests with coverage
      working-directory: ./backend
      run: npm run test:cov
      
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        directory: ./backend/coverage
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false
        
    - name: Test summary
      if: always()
      run: |
        echo "## Backend Test Results for Node ${{ matrix.node-version }}" >> $GITHUB_STEP_SUMMARY
        echo "✅ Tests completed successfully!" >> $GITHUB_STEP_SUMMARY
        echo "- Node version: ${{ matrix.node-version }}" >> $GITHUB_STEP_SUMMARY
        echo "- Working directory: backend/" >> $GITHUB_STEP_SUMMARY
        echo "- Test command: npm run test" >> $GITHUB_STEP_SUMMARY
        echo "- Coverage command: npm run test:cov" >> $GITHUB_STEP_SUMMARY

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scizor Dashboard - Expanded</title>
    <link rel="stylesheet" href="styles/expanded.css">
</head>
<body>
    <div id="expanded-app">
        <div class="expanded-header">
            <h1>Scizor Dashboard - Expanded View</h1>
            <button id="close-btn" class="btn btn-secondary">Close</button>
        </div>

        <div class="expanded-content">
            <!-- Enhanced Clipboard Panel -->
            <div class="expanded-panel clipboard-panel">
                <h2>Enhanced Clipboard History</h2>
                <div class="panel-content">
                    <div class="clipboard-controls">
                        <button id="clear-clipboard" class="btn btn-secondary">Clear History</button>
                        <button id="refresh-clipboard" class="btn btn-secondary">Refresh</button>
                    </div>
                    <div id="clipboard-list" class="clipboard-list">
                        <!-- Clipboard items will be loaded here -->
                    </div>
                </div>
            </div>

            <!-- Enhanced Notes Panel -->
            <div class="expanded-panel notes-panel">
                <h2>Enhanced Notes</h2>
                <div class="panel-content">
                    <div class="notes-controls">
                        <button id="new-note" class="btn btn-primary">New Note</button>
                        <button id="refresh-notes" class="btn btn-secondary">Refresh</button>
                    </div>
                    <div id="notes-list" class="notes-list">
                        <!-- Notes will be loaded here -->
                    </div>
                </div>
            </div>

            <!-- Enhanced AI Prompt Enhancement -->
            <div class="expanded-panel enhance-prompt-panel">
                <h2>Enhanced AI Prompt Enhancement</h2>
                <div class="panel-content">
                    <div class="form-group">
                        <label for="enhance-prompt-input">Enter your prompt:</label>
                        <textarea id="enhance-prompt-input" class="form-control" rows="4" placeholder="Enter your prompt here..."></textarea>
                    </div>
                    <div class="enhance-controls">
                        <button id="enhance-prompt-btn" class="btn btn-primary">Enhance Prompt</button>
                        <button id="clear-enhance" class="btn btn-secondary">Clear</button>
                    </div>
                    <div id="enhance-result" class="enhance-result">
                        <!-- Enhanced prompt will be shown here -->
                    </div>
                </div>
            </div>

            <!-- Enhanced AI Smart Response -->
            <div class="expanded-panel generate-response-panel">
                <h2>Enhanced AI Smart Response</h2>
                <div class="panel-content">
                    <div class="form-group">
                        <label for="generate-response-input">Enter your message:</label>
                        <textarea id="generate-response-input" class="form-control" rows="4" placeholder="Enter your message here..."></textarea>
                    </div>
                    <div class="generate-controls">
                        <button id="generate-response-btn" class="btn btn-primary">Generate Response</button>
                        <button id="clear-generate" class="btn btn-secondary">Clear</button>
                        <button id="speak-response" class="btn btn-secondary">Speak</button>
                    </div>
                    <div id="generate-result" class="generate-result">
                        <!-- Generated response will be shown here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/expanded.js"></script>
</body>
</html>

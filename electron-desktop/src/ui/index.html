<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scizor Dashboard</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div id="app">
        <!-- Header Panel -->
        <div id="header-panel" class="panel header-panel">

    <script src="js/panels/clipboard-panel.js"></script>
    <script src="js/panels/notes-panel.js"></script>
    <script src="js/panels/enhance-prompt-panel.js"></script>
    <script src="js/panels/generate-response-panel.js"></script>

    <script src="js/components/spinner.js"></script>
    <script src="js/auth/auth-panel.js"></script>
</body>
</html>
